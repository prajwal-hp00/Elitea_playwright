name: 🎭 Playwright Tests with Reports

on:
  push:
    branches: [ main, feature/*, test/* ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  test:
    name: 🧪 Run Tests & Generate Reports
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: 📦 Install Dependencies
      run: npm install

    - name: 🎭 Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: 🧪 Run Playwright Tests
      run: npm test
      continue-on-error: true

    - name: 📊 Upload HTML Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-html-report
        path: playwright-report/
        retention-days: 30

    - name: 📋 Upload JSON Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-json-report
        path: test-results/results.json
        retention-days: 30

    - name: 📄 Upload JUnit Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-junit-report
        path: test-results/junit.xml
        retention-days: 30

    - name: 📸 Upload Screenshots
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-screenshots
        path: test-results/**/*.png
        retention-days: 30
        if-no-files-found: ignore

    - name: 🎬 Upload Videos
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-videos
        path: test-results/**/*.webm
        retention-days: 30
        if-no-files-found: ignore

    - name: 📈 Generate Summary
      if: always()
      run: |
        echo "## 🎭 Test Execution Complete!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📊 Reports Generated:" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ HTML Report" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ JSON Report" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ JUnit XML" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "📦 Download from Artifacts section" >> $GITHUB_STEP_SUMMARY

    - name: 💬 Comment on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '## 🎭 Test Reports Ready!\n\n📊 Download artifacts from the workflow run to view reports:\n- HTML Report\n- JSON Report\n- JUnit XML\n\n[View Workflow Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})'
          });
